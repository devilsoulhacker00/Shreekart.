name: Build ShreeKart Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp config.js www/
          cp manifest.json www/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks

      - name: Verify release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"

          keytool -list \
            -keystore android/app/release-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias shreekart \
            -v > /tmp/keystore-check.txt

          grep -E "Alias name:|Entry type:|Valid from:" /tmp/keystore-check.txt

      - name: Create keystore properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          cat > android/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=shreekart
          storeFile=app/release-keystore.jks
          EOF

          chmod 600 android/keystore.properties

      - name: Configure Android release signing
        run: |
          cat > android/app/release-signing.gradle <<'GRADLE'
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (!keystorePropertiesFile.exists()) {
              throw new GradleException("keystore.properties not found")
          }

          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          android {
              signingConfigs {
                  shreekartRelease {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.shreekartRelease
                  }
              }
          }
          GRADLE

          printf '\napply from: "../release-signing.gradle"\n' >> android/app/build.gradle

      - name: Verify signing setup
        run: |
          test -f android/keystore.properties
          test -f android/app/release-signing.gradle
          grep "keyAlias=shreekart" android/keystore.properties
          grep "storeFile=app/release-keystore.jks" android/keystore.properties
          echo "Signing configuration is ready."

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ShreeKart-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
