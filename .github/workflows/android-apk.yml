name: Build ShreeKart Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp config.js www/
          cp manifest.json www/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks

      - name: Verify release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"

          keytool -list \
            -keystore android/app/release-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias shreekart \
            -v > /tmp/keystore-check.txt

          grep -E "Alias name:|Entry type:|Valid from:" /tmp/keystore-check.txt

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Add a separate release signing configuration.
          signing_config = """
              signingConfigs {
                  shreekartRelease {
                      storeFile file("release-keystore.jks")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias "shreekart"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          if "shreekartRelease" not in s:
              s = s.replace(
                  "    buildTypes {",
                  signing_config + "\n    buildTypes {",
                  1
              )

          # Attach the signing config ONLY to buildTypes.release.
          pattern = r"(buildTypes\\s*\\{\\s*release\\s*\\{)"

          if "signingConfig signingConfigs.shreekartRelease" not in s:
              s, count = re.subn(
                  pattern,
                  r'\1\n            signingConfig signingConfigs.shreekartRelease',
                  s,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "Could not locate buildTypes { release { } in build.gradle"
                  )

          p.write_text(s)
          PY

      - name: Check Gradle signing configuration
        run: |
          grep -n -A12 -B2 "shreekartRelease" android/app/build.gradle
          grep -n -A8 -B2 "signingConfig" android/app/build.gradle

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ShreeKart-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
