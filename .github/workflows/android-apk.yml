name: Build ShreeKart Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/
          cp app.js www/
          cp style.css www/
          cp config.js www/
          cp manifest.json www/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android/app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")
          s = p.read_text()

          block = """    signingConfigs {
              release {
                  storeFile file("release-keystore.jks")
                  storePassword System.getenv("STORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          """

          if "signingConfigs {" not in s:
              s = s.replace("android {\n", "android {\n" + block, 1)

          if "signingConfig signingConfigs.release" not in s:
              s = s.replace(
                  "        release {\n",
                  "        release {\n            signingConfig signingConfigs.release\n",
                  1
              )

          p.write_text(s)
          PY

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShreeKart-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
