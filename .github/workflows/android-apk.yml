name: Build ShreeKart Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Next.js environment
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('config.js', 'utf8');
          const url = config.match(/SUPABASE_URL='([^']+)'/)?.[1];
          const key = config.match(/SUPABASE_ANON_KEY='([^']+)'/)?.[1];
          if (!url || !key) throw new Error('Supabase config missing');
          fs.writeFileSync('.env.production.local',
            'NEXT_PUBLIC_SUPABASE_URL=' + url + '\n' +
            'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' + key + '\n'
          );
          NODE

      - name: Install dependencies
        run: npm install

      - name: Build Next.js web app
        run: npm run build

      - name: Prepare Capacitor web directory
        run: |
          rm -rf www
          cp -R out www

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks

      - name: Verify release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"

          keytool -list \
            -keystore android/app/release-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias shreekart \
            -v > /tmp/keystore-check.txt

          grep -E "Alias name:|Entry type:|Valid from:" /tmp/keystore-check.txt

      - name: Create keystore properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path("android/keystore.properties")

          content = (
              "storePassword=" + os.environ["STORE_PASSWORD"] + "\n"
              "keyPassword=" + os.environ["KEY_PASSWORD"] + "\n"
              "keyAlias=shreekart\n"
              "storeFile=app/release-keystore.jks\n"
          )

          p.write_text(content)
          PY

          chmod 600 android/keystore.properties

      - name: Configure release signing
        run: |
          cat > android/app/release-signing.gradle <<'GRADLE'
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (!keystorePropertiesFile.exists()) {
              throw new GradleException("keystore.properties not found")
          }

          keystoreProperties.load(
              new FileInputStream(keystorePropertiesFile)
          )

          android {
              signingConfigs {
                  shreekartRelease {
                      storeFile rootProject.file(
                          keystoreProperties["storeFile"]
                      )

                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.shreekartRelease
                  }
              }
          }
          GRADLE

          printf '\napply from: "release-signing.gradle"\n' >> android/app/build.gradle

      - name: Verify signing configuration
        run: |
          test -f android/keystore.properties
          test -f android/app/release-signing.gradle

          grep "keyAlias=shreekart" android/keystore.properties
          grep "storeFile=app/release-keystore.jks" android/keystore.properties

          echo "Release signing configuration is ready."

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: ShreeKart-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
